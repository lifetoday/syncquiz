<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coming Soon</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1e3a5f;
      --blue: #2f6fd6;
      --teal: #1fb5a6;
      --sun: #ffc845;
      --coral: #ff7a59;
      --bg: #f5f8fd;
    }

    html, body { height: 100%; }

    body {
      font-family: "Nunito", system-ui, sans-serif;
      background: var(--bg);
      color: var(--navy);
      overflow-x: hidden;
    }

    /* Soft background blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: .45;
      z-index: 0;
      animation: float 14s ease-in-out infinite;
    }
    .blob-1 { width: 380px; height: 380px; background: var(--blue);  top: -120px; left: -100px; }
    .blob-2 { width: 320px; height: 320px; background: var(--teal);  bottom: -120px; right: -80px; animation-delay: -4s; }
    .blob-3 { width: 220px; height: 220px; background: var(--sun);   top: 55%; left: 8%; animation-delay: -8s; opacity: .35; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(30px, -25px) scale(1.08); }
    }

    /* Floating shapes */
    .shape {
      position: fixed;
      z-index: 0;
      opacity: .8;
      animation: drift 9s ease-in-out infinite;
    }
    .shape-circle   { width: 18px; height: 18px; border: 4px solid var(--coral); border-radius: 50%; top: 18%; right: 18%; }
    .shape-square   { width: 16px; height: 16px; background: var(--teal); border-radius: 4px; bottom: 22%; left: 20%; animation-delay: -3s; }
    .shape-triangle { width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent;
                      border-bottom: 19px solid var(--sun); top: 26%; left: 24%; animation-delay: -6s; }
    .shape-dot      { width: 10px; height: 10px; background: var(--blue); border-radius: 50%; bottom: 28%; right: 24%; animation-delay: -2s; }

    @keyframes drift {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-18px) rotate(25deg); }
    }

    .wrapper { position: relative; z-index: 1; }

    .card-soon {
      background: rgba(255, 255, 255, .78);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(30, 58, 95, .12);
      opacity: 0;
      transform: translateY(20px);
    }

    .badge-soon {
      background: rgba(47, 111, 214, .1);
      color: var(--blue);
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: .75rem;
      padding: .5rem 1rem;
      border-radius: 999px;
    }

    .title {
      font-weight: 800;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      line-height: 1.05;
      background: linear-gradient(90deg, var(--blue), var(--teal));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle { color: #5b6b82; font-size: 1.1rem; }

    .dots span {
      display: inline-block;
      width: 12px; height: 12px;
      margin: 0 5px;
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite;
    }
    .dots span:nth-child(1) { background: var(--blue); }
    .dots span:nth-child(2) { background: var(--teal); animation-delay: .15s; }
    .dots span:nth-child(3) { background: var(--sun);  animation-delay: .3s; }
    .dots span:nth-child(4) { background: var(--coral); animation-delay: .45s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-12px); }
    }

    footer { color: #8a97ab; font-size: .875rem; }

    @media (prefers-reduced-motion: reduce) {
      .blob, .shape, .dots span { animation: none; }
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <span class="shape shape-circle"></span>
  <span class="shape shape-square"></span>
  <span class="shape shape-triangle"></span>
  <span class="shape shape-dot"></span>

  <main class="wrapper container d-flex flex-column justify-content-center align-items-center min-vh-100 px-3">
    <div class="card-soon text-center px-4 py-5 p-md-5 col-12 col-md-9 col-lg-7">
      <span class="badge-soon d-inline-block mb-4">Stay tuned</span>
      <h1 class="title mb-3">Coming Soon</h1>
      <p class="subtitle mb-4 mx-auto" style="max-width: 420px;">
        We're working on something new. Check back soon.
      </p>
      <div class="dots" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
    </div>

    <footer class="mt-4 text-center">&copy; <span id="year"></span></footer>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(function () {
      $('#year').text(new Date().getFullYear());
      $('.card-soon').animate({ opacity: 1 }, {
        duration: 700,
        step: function (now) {
          $(this).css('transform', 'translateY(' + (20 - 20 * now) + 'px)');
        }
      });
    });
  </script>
</body>
</html>
